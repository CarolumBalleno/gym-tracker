<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Tracker">
  <link rel="manifest" href="manifest.json">
  <title>Gym Tracker Pro</title>
  
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --card-sub: #121215;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --green: #16a34a;
      --red: #dc2626;
      --text: #f4f4f5;
      --text-sec: #a1a1aa;
      --border: #27272a;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(90px, env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg); color: var(--text); user-select: none;
    }

    /* BARRA DE PESTAÑAS NATIVA */
    .tab-bar { display: flex; gap: 6px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .tab-btn {
      flex: 1; padding: 10px 4px; background: var(--card); color: var(--text-sec); border: 1px solid var(--border);
      border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; text-align: center;
    }
    .tab-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }

    .header { margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0; font-weight: 800; letter-spacing: -0.5px; text-transform: uppercase; }
    .subtitle { font-size: 11px; color: var(--text-sec); font-weight: 500; margin-top: 4px; }

    .card { background: var(--card); border-radius: 8px; padding: 14px; margin-bottom: 14px; border: 1px solid var(--border); }
    
    .primary-btn {
      width: 100%; background: var(--text); color: var(--bg); border: none; padding: 14px; border-radius: 6px;
      font-size: 13px; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-bottom: 10px;
    }
    .session-toggle-btn {
      width: 100%; background: var(--accent); color: white; border: none; padding: 14px; border-radius: 6px;
      font-size: 13px; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-bottom: 14px; display: none;
    }

    label { font-size: 10px; color: var(--text-sec); text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 6px; }
    select, input {
      width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 12px; border-radius: 6px; font-size: 14px; outline: none; margin-bottom: 10px; -webkit-appearance: none;
    }

    .phase-tag { font-size: 10px; font-weight: 800; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; margin: 14px 0 6px 0; }

    /* TARJETAS DE EJERCICIO EN VIVO */
    .checklist-item { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
    .checklist-item.completed { border-color: var(--green); }
    .checklist-header { padding: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: var(--card-sub); }
    .checklist-title { font-weight: 800; font-size: 13px; text-transform: uppercase; flex: 1; margin-right: 8px; }
    .checklist-actions { display: flex; gap: 4px; align-items: center; }
    .icon-btn { background: var(--card); border: 1px solid var(--border); color: var(--text-sec); border-radius: 4px; padding: 6px 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .badge { font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 4px; background: var(--card); color: var(--text-sec); }
    .checklist-item.completed .badge { background: var(--green); color: white; }

    .checklist-body { padding: 12px; border-top: 1px solid var(--border); display: none; }

    /* GUÍAS */
    .tech-box { background: #000; border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-bottom: 10px; font-size: 11px; color: var(--text-sec); line-height: 1.4; }
    .ex-img { width: 100%; max-height: 150px; object-fit: contain; background: #000; border-radius: 4px; margin-bottom: 8px; }

    /* TABLA DE SERIES */
    .table-headers { display: flex; gap: 4px; font-size: 9px; font-weight: 800; color: var(--text-sec); text-transform: uppercase; margin-bottom: 6px; }
    .col-num { width: 22px; text-align: center; }
    .col-w { flex: 1; text-align: center; }
    .col-r { flex: 1; text-align: center; }
    .col-rir { flex: 1.6; text-align: center; }
    .col-action { width: 34px; text-align: center; }

    .set-row { display: flex; gap: 4px; align-items: center; margin-bottom: 6px; background: var(--bg); padding: 4px; border-radius: 6px; border: 1px solid var(--border); }
    .set-row.locked { opacity: 0.6; border-color: var(--green); }
    .set-num { font-weight: 700; width: 22px; color: var(--text-sec); text-align: center; font-size: 11px; }
    .set-row input { margin-bottom: 0; text-align: center; font-weight: 700; background: var(--card); border: none; padding: 8px 4px; border-radius: 4px; font-size: 13px; }
    
    .rir-selector { display: flex; gap: 2px; flex: 1.6; }
    .rir-btn { flex: 1; background: var(--card); color: var(--text-sec); padding: 8px 0; border-radius: 4px; font-size: 10px; font-weight: 800; text-align: center; cursor: pointer; }
    .rir-btn.active { background: var(--text); color: var(--bg); }

    .btn-action-set { width: 34px; height: 34px; background: var(--card); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    .btn-sub { background: var(--bg); color: var(--text-sec); border: 1px dashed var(--border); font-size: 11px; padding: 8px; margin-bottom: 10px; width: 100%; cursor: pointer; font-weight: 700; }
    .btn-finish-ex { width: 100%; background: var(--green); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 12px; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-top: 8px; display: none; }

    /* MODAL DESCANSO ENTRE SERIES */
    .rest-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(9,9,11,0.96); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .rest-modal.active { opacity: 1; pointer-events: all; }
    .rest-title { font-size: 12px; color: var(--text-sec); font-weight: 800; letter-spacing: 2px; margin-bottom: 16px; text-transform: uppercase; }
    .rest-timer { font-size: 64px; font-family: monospace; font-weight: 800; color: var(--accent); margin-bottom: 30px; }
    .rest-controls { display: flex; gap: 12px; }
    .rest-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 12px 20px; border-radius: 6px; font-size: 13px; font-weight: 800; cursor: pointer; }
    .rest-btn.skip { background: var(--text); color: var(--bg); }

    /* HISTORIAL */
    .hist-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .hist-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 8px; }
    .hist-date { font-size: 12px; font-weight: 800; color: var(--text); text-transform: uppercase; }
    .hist-tonnage { font-size: 11px; color: var(--green); font-weight: 700; }
  </style>
</head>
<body>

  <!-- MODAL DE DESCANSO -->
  <div class="rest-modal" id="restModal">
    <div class="rest-title">Recuperación Intramuscular</div>
    <div class="rest-timer" id="timerDisplay">00:00</div>
    <div class="rest-controls">
      <button class="rest-btn" onclick="addTimer(30)">+30s</button>
      <button class="rest-btn skip" onclick="closeTimer()">SALTAR</button>
    </div>
  </div>

  <!-- NAVEGACIÓN -->
  <div class="tab-bar">
    <div class="tab-btn active" id="tabWork" onclick="switchTab('work')">🏋️ Entrenar</div>
    <div class="tab-btn" id="tabHist" onclick="switchTab('hist')">📅 Historial</div>
    <div class="tab-btn" id="tabBack" onclick="switchTab('back')">⚙️ Datos</div>
  </div>

  <!-- VISTA 1: ENTRENAMIENTO -->
  <div id="viewWork">
    <div class="header">
      <h1>Protocolo de Entrenamiento</h1>
      <div class="subtitle" id="workoutStatusSubtitle">Sistema Local-First Activo | 0 ms Latencia</div>
    </div>

    <button class="primary-btn" id="btnGen" onclick="generateWorkoutPlan()">Crear Plan Óptimo del Día</button>
    <button class="session-toggle-btn" id="btnSession" onclick="toggleSession()">▶️ INICIAR ENTRENAMIENTO</button>

    <div class="card" id="routineCard" style="display: none;">
      <div id="checklistContainer"></div>
      <button class="primary-btn" style="background: var(--card); color: var(--text); border: 1px dashed var(--border); margin-top: 10px;" onclick="promptAddExtraExercise()">+ Añadir Bloque Extra a la Sesión</button>
    </div>
  </div>

  <!-- VISTA 2: HISTORIAL -->
  <div id="viewHist" style="display: none;">
    <div class="header">
      <h1>Historial y Métricas</h1>
      <div class="subtitle">Auditoría de volumen de trabajo local</div>
    </div>
    <div id="historyList"></div>
  </div>

  <!-- VISTA 3: GESTIÓN DE DATOS / BACKUP -->
  <div id="viewBack" style="display: none;">
    <div class="header">
      <h1>Gestión de Datos</h1>
      <div class="subtitle">Exportación y seguridad de tu base de datos</div>
    </div>
    <div class="card">
      <button class="primary-btn" onclick="exportDataBackup()">📥 Exportar Copia de Seguridad (JSON)</button>
      <input type="file" id="importInput" style="display: none;" onchange="importDataBackup(event)">
      <button class="primary-btn" style="background: var(--card); color: var(--text); border: 1px solid var(--border);" onclick="document.getElementById('importInput').click()">📤 Importar Copia de Seguridad</button>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // CATÁLOGO MASIVO (100+ EJERCICIOS CON MATRIZ BIOMECÁNICA)
    // -------------------------------------------------------------
    const EXERCISE_CATALOG = [
      // CALENTAMIENTO
      { id: "W01", name: "Movilidad Articular y Rotaciones", group: "Calentamiento", pattern: "Movilidad", equipment: "Peso Corporal", restSec: 0, isBodyweight: true, isIso: false, guide: "5 min rotaciones hombros, escápulas y cadera." },
      { id: "W02", name: "Cardio Suave en Cinta/Bici", group: "Calentamiento", pattern: "Cardio", equipment: "Cinta / Bici", restSec: 0, isBodyweight: true, isIso: false, guide: "5 min a ritmo muy suave para elevar temperatura." },
      { id: "W03", name: "Series de Aproximación", group: "Calentamiento", pattern: "Aproximación", equipment: "Según Ejercicio", restSec: 60, isBodyweight: false, isIso: false, guide: "1-2 series con 40-50% del peso antes del primer ejercicio pesado." },

      // PECHO (EMPUJE HORIZONTAL)
      { id: "P01", name: "Press Banca Plano con Barra", group: "Pecho", pattern: "Empuje Horizontal", equipment: "Barra Olímpica", restSec: 120, isBodyweight: false, isIso: false, guide: "Retracción escapular, barra al esternón." },
      { id: "P02", name: "Press Plano con Mancuernas", group: "Pecho", pattern: "Empuje Horizontal", equipment: "Mancuernas", restSec: 90, isBodyweight: false, isIso: false, guide: "Baja controlado hasta la línea del pectoral." },
      { id: "P03", name: "Press de Pecho en Máquina", group: "Pecho", pattern: "Empuje Horizontal", equipment: "Máquina", restSec: 90, isBodyweight: false, isIso: false, guide: "Empuje guiado manteniendo hombros fijos atrás." },
      { id: "P04", name: "Press Inclinado con Mancuernas", group: "Pecho", pattern: "Empuje Inclinado", equipment: "Mancuernas", restSec: 90, isBodyweight: false, isIso: false, guide: "Banco a 30 grados para enfocar haz clavicular." },
      { id: "P05", name: "Press Inclinado con Barra", group: "Pecho", pattern: "Empuje Inclinado", equipment: "Barra Olímpica", restSec: 120, isBodyweight: false, isIso: false, guide: "Descenso hacia la parte superior del pecho." },
      { id: "P06", name: "Press Inclinado en Máquina", group: "Pecho", pattern: "Empuje Inclinado", equipment: "Máquina", restSec: 90, isBodyweight: false, isIso: false, guide: "Tensión continua en el pectoral superior." },
      { id: "P07", name: "Aperturas en Máquina (Pec Deck)", group: "Pecho", pattern: "Aducción Horizontal", equipment: "Máquina Pec Deck", restSec: 75, isBodyweight: false, isIso: false, guide: "Codos semiflexionados, junta apretando 1s." },

      { id: "P09", name: "Cruce de Poleas desde Arriba", group: "Pecho", pattern: "Aducción Horizontal", equipment: "Polea Doble", restSec: 75, isBodyweight: false, isIso: false, guide: "Tira hacia abajo cruzando al frente." },
      { id: "P10", name: "Fondos en Paralelas (Pecho)", group: "Pecho", pattern: "Empuje Declinado", equipment: "Peso Corporal", restSec: 120, isBodyweight: true, isIso: false, guide: "Inclina el torso hacia adelante para activar pectoral." },

      // ESPALDA (TRACCIÓN VERTICAL Y HORIZONTAL)
      { id: "E01", name: "Dominadas Pronas", group: "Espalda", pattern: "Tracción Vertical", equipment: "Peso Corporal", restSec: 120, isBodyweight: true, isIso: false, guide: "Pecho hacia la barra, tracción con los dorsales." },
      { id: "E02", name: "Dominadas Neutras", group: "Espalda", pattern: "Tracción Vertical", equipment: "Peso Corporal", restSec: 120, isBodyweight: true, isIso: false, guide: "Agarre neutro para mayor comodidad articular." },
      { id: "E03", name: "Jalón al Pecho Agarre Abierto", group: "Espalda", pattern: "Tracción Vertical", equipment: "Polea Alta", restSec: 90, isBodyweight: false, isIso: false, guide: "Tira con los codos apuntando al suelo." },
      { id: "E04", name: "Jalón al Pecho Agarre Neutro", group: "Espalda", pattern: "Tracción Vertical", equipment: "Polea Alta", restSec: 90, isBodyweight: false, isIso: false, guide: "Gran rango de estiramiento dorsal." },
      { id: "E05", name: "Jalón Unilateral en Polea", group: "Espalda", pattern: "Tracción Vertical", equipment: "Polea Alta", restSec: 75, isBodyweight: false, isIso: false, guide: "Tira pegando el codo a la cadera." },
      { id: "E06", name: "Remo con Barra 45°", group: "Espalda", pattern: "Tracción Horizontal", equipment: "Barra Olímpica", restSec: 120, isBodyweight: false, isIso: false, guide: "Torso rígido a 45 grados, barra hacia el ombligo." },
      { id: "E07", name: "Remo con Mancuerna en Banco", group: "Espalda", pattern: "Tracción Horizontal", equipment: "Mancuernas", restSec: 90, isBodyweight: false, isIso: false, guide: "Tracciona hacia la cadera sin rotar el torso." },

      { id: "Q01", name: "Prensa de Piernas 45°", group: "Cuádriceps", pattern: "Dominante Rodilla", equipment: "Prensa", restSec: 120, isBodyweight: false, isIso: false, guide: "Pies al ancho de hombros, baja profundo sin despegar cadera." },

      { id: "H02", name: "Curl Femoral Tumbado", group: "Isquios / Glúteo", pattern: "Flexión de Rodilla", equipment: "Máquina Femoral", restSec: 75, isBodyweight: false, isIso: false, guide: "Flexiona rápido y regresa en 2-3s." },
      { id: "H03", name: "Curl Femoral Sentado", group: "Isquios / Glúteo", pattern: "Flexión de Rodilla", equipment: "Máquina Femoral", restSec: 75, isBodyweight: false, isIso: false, guide: "Excelente activación con cadera flexionada." },
      { id: "H04", name: "Hip Thrust con Barra", group: "Isquios / Glúteo", pattern: "Extensión de Cadera", equipment: "Barra / Banco", restSec: 120, isBodyweight: false, isIso: false, guide: "Empuja con talones y aprieta glúteo arriba." },

      { id: "T02", name: "Press Francés con Barra Z", group: "Tríceps", pattern: "Extensión de Codo", equipment: "Barra Z / Banco", restSec: 75, isBodyweight: false, isIso: false, guide: "Flexiona codos hacia la frente sin abrirlos." },
      { id: "T03", name: "Extensión de Tríceps sobre la Cabeza", group: "Tríceps", pattern: "Extensión de Codo", equipment: "Polea / Mancuerna", restSec: 60, isBodyweight: false, isIso: false, guide: "Gran estiramiento de la cabeza larga." },
      { id: "T04", name: "Fondos en Máquina o Banco", group: "Tríceps", pattern: "Extensión de Codo", equipment: "Máquina / Banco", restSec: 75, isBodyweight: false, isIso: false, guide: "Empuja hacia abajo con fuerza de tríceps." },

      // GEMELOS Y CORE
      { id: "C01", name: "Elevación de Talones de Pie", group: "Gemelos", pattern: "Flexión Plantar", equipment: "Máquina", restSec: 60, isBodyweight: false, isIso: false, guide: "Sube al máximo y estira lento abajo." },
      { id: "C02", name: "Elevación de Talones Sentado", group: "Gemelos", pattern: "Flexión Plantar", equipment: "Máquina Sentado", restSec: 60, isBodyweight: false, isIso: false, guide: "Enfoque principal en el músculo sóleo." },
      { id: "AB01", name: "Plancha Abdominal Isométrica", group: "Core", pattern: "Isométrico", equipment: "Peso Corporal", restSec: 60, isBodyweight: true, isIso: true, guide: "Bloqueo total abdominal y de glúteos." },
      { id: "AB02", name: "Crunch en Polea Alta", group: "Core", pattern: "Flexión de Tronco", equipment: "Polea Alta", restSec: 60, isBodyweight: false, isIso: false, guide: "De rodillas, aproxima costillas a pelvis." },
      { id: "AB03", name: "Elevación de Piernas Colgado", group: "Core", pattern: "Flexión de Cadera", equipment: "Barra / Torre", restSec: 60, isBodyweight: true, isIso: false, guide: "Eleva rodillas/piernas controlando el balanceo." },

      // CARDIO FINAL
      { id: "CR01", name: "Caminata Inclinada en Cinta (Zona 2)", group: "Cardio", pattern: "Aeróbico", equipment: "Cinta", restSec: 0, isBodyweight: true, isIso: false, guide: "Inclinación 8-12%, velocidad 4-5 km/h, 15-20 min." },
      { id: "CR02", name: "Bicicleta Estática / Elíptica", group: "Cardio", pattern: "Aeróbico", equipment: "Bici / Elíptica", restSec: 0, isBodyweight: true, isIso: false, guide: "Cadencia moderada y respiración controlada." }
    ];

    // -------------------------------------------------------------
    // MOTOR LOCAL DE ALMACENAMIENTO Y ESTADO
    // -------------------------------------------------------------
    let state = {
      isSessionActive: false,
      currentRoutine: [],
      completedSets: {}, // { exIdx: [ {w, r, rir, locked} ] }
      history: JSON.parse(localStorage.getItem('gym_tracker_history') || '[]'),
      activeTimer: null,
      timeLeft: 0
    };

    window.onload = () => {
      // Registro de Service Worker para funcionamiento sin conexión
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(()=>{});
      }
      renderHistoryView();
    };

    function switchTab(t) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('viewWork').style.display = 'none';
      document.getElementById('viewHist').style.display = 'none';
      document.getElementById('viewBack').style.display = 'none';

      if (t === 'work') {
        document.getElementById('tabWork').classList.add('active');
        document.getElementById('viewWork').style.display = 'block';
      } else if (t === 'hist') {
        document.getElementById('tabHist').classList.add('active');
        document.getElementById('viewHist').style.display = 'block';
        renderHistoryView();
      } else {
        document.getElementById('tabBack').classList.add('active');
        document.getElementById('viewBack').style.display = 'block';
      }
    }

    // GENERADOR DETERMINISTA DE RUTINA
    function generateWorkoutPlan() {
      const todayStr = new Date().toISOString().split('T')[0];
      const trainedToday = state.history.some(h => h.date === todayStr);

      if (trainedToday) {
        alert("🛡️ Ya has completado un entrenamiento hoy. El descanso es esencial para la hipertrofia. Usa '+ Añadir Bloque Extra' si necesitas registrar algo puntual.");
        return;
      }

      // Calcular descanso por grupos musculares
      const lastGroupDates = {};
      state.history.forEach(h => {
        h.exercises.forEach(ex => {
          if (!lastGroupDates[ex.group] || lastGroupDates[ex.group] < h.date) {
            lastGroupDates[ex.group] = h.date;
          }
        });
      });

      const today = new Date();
      const groupsRest = [];
      const strengthGroups = ["Pecho", "Espalda", "Cuádriceps", "Isquios / Glúteo", "Hombro", "Bíceps", "Tríceps", "Gemelos", "Core"];

      strengthGroups.forEach(g => {
        let days = 30;
        if (lastGroupDates[g]) {
          const diff = today - new Date(lastGroupDates[g]);
          days = Math.max(0, Math.floor(diff / (1000 * 60 * 60 * 24)));
        }
        groupsRest.push({ group: g, days: days });
      });

      groupsRest.sort((a,b) => b.days - a.days);
      const targetGroups = [groupsRest[0].group, groupsRest[1].group];

      const planned = [];
      
      // Calentamiento
      planned.push({ ...EXERCISE_CATALOG[0], phase: "FASE 1: CALENTAMIENTO", target: "10 min", weight: 0 });

      // 4 Ejercicios de Fuerza de los grupos con más descanso
      let count = 0;
      for (let ex of EXERCISE_CATALOG) {
        if (targetGroups.includes(ex.group) && count < 4 && ex.group !== "Calentamiento" && ex.group !== "Cardio") {
          let w = ex.isBodyweight ? 0 : 20;
          let note = "Carga inicial";
          
          // Buscar último rendimiento para sobrecarga o descarga
          const lastLog = findLastExerciseLog(ex.name);
          if (lastLog && lastLog.sets.length > 0) {
            const lastSet = lastLog.sets[lastLog.sets.length - 1];
            if (lastSet.reps < 8 && !ex.isIso) {
              w = ex.isBodyweight ? lastSet.weight : Math.round((lastSet.weight * 0.9) * 2) / 2;
              note = "Descarga táctica (-10%)";
            } else if (lastSet.rir >= 2 && !ex.isIso) {
              w = ex.isBodyweight ? lastSet.weight : Math.round((lastSet.weight * 1.025) * 2) / 2;
              note = "Sobrecarga progresiva (+2.5%)";
            } else {
              w = lastSet.weight;
              note = "Mantenimiento";
            }
          }

          planned.push({
            ...ex,
            phase: "FASE 2: FUERZA E HIPERTROFIA",
            target: ex.isIso ? "45s-60s" : "8-12",
            weight: w,
            note: note
          });
          count++;
        }
      }

      // Cardio
      const cardio = EXERCISE_CATALOG.find(e => e.group === "Cardio");
      if (cardio) planned.push({ ...cardio, phase: "FASE 3: VUELTA A LA CALMA", target: "15 min", weight: 0 });

      state.currentRoutine = planned;
      document.getElementById('btnGen').style.display = 'none';
      document.getElementById('btnSession').style.display = 'block';
      renderChecklist();
    }

    function findLastExerciseLog(name) {
      for (let h of state.history) {
        const found = h.exercises.find(e => e.name === name);
        if (found) return found;
      }
      return null;
    }

    function toggleSession() {
      state.isSessionActive = !state.isSessionActive;
      const btn = document.getElementById('btnSession');
      if (state.isSessionActive) {
        btn.innerText = "⏹️ FINALIZAR SESIÓN";
        btn.style.background = "var(--red)";
      } else {
        btn.innerText = "▶️ INICIAR ENTRENAMIENTO";
        btn.style.background = "var(--accent)";
      }
    }

    function renderChecklist() {
      const container = document.getElementById('checklistContainer');
      container.innerHTML = '';

      let lastPhase = "";
      state.currentRoutine.forEach((ex, idx) => {
        if (!state.completedSets[idx]) {
          state.completedSets[idx] = [
            { weight: ex.weight, reps: ex.isIso ? 45 : 10, rir: 2, locked: false },
            { weight: ex.weight, reps: ex.isIso ? 45 : 10, rir: 2, locked: false },
            { weight: ex.weight, reps: ex.isIso ? 45 : 10, rir: 2, locked: false }
          ];
        }

        if (ex.phase !== lastPhase) {
          container.innerHTML += `<div class="phase-tag">${ex.phase}</div>`;
          lastPhase = ex.phase;
        }

        const isBW = ex.isBodyweight;
        const isIso = ex.isIso;
        const badge = isBW ? "BW" : (isIso ? "ISOMÉTRICO" : `${ex.weight}kg`);

        container.innerHTML += `
          <div class="checklist-item" id="item_${idx}">
            <div class="checklist-header">
              <div class="checklist-title" onclick="toggleBody(${idx})">${ex.name}</div>
              <div class="checklist-actions">
                <button class="icon-btn" onclick="moveExercise(${idx}, -1)">▲</button>
                <button class="icon-btn" onclick="moveExercise(${idx}, 1)">▼</button>
                <div class="badge" id="badge_${idx}">${badge}</div>
              </div>
            </div>
            <div class="checklist-body" id="body_${idx}">
              <div class="tech-box">
                <strong>Equipamiento:</strong> ${ex.equipment}<br>
                <strong>Patrón:</strong> ${ex.pattern}<br>
                <strong>Técnica:</strong> ${ex.guide}
              </div>

              ${ex.phase.includes("FUERZA") ? `
                <button class="btn-sub" onclick="substituteExercise(${idx})">🔄 Sustituir por Máquina Ocupada (Mismo Patrón)</button>
                <div class="table-headers">
                  <div class="col-num">#</div>
                  <div class="col-w">${isBW ? '+LASTRE' : 'PESO'}</div>
                  <div class="col-r">${isIso ? 'SEG' : 'REPS'}</div>
                  <div class="col-rir">RIR</div>
                  <div class="col-action">OK</div>
                </div>
                <div id="setsContainer_${idx}"></div>
              ` : `
                <div style="font-size: 12px; margin-bottom: 8px;">Duración Objetivo: <strong>${ex.target}</strong></div>
              `}

              <button class="btn-finish-ex" id="btnFinish_${idx}" onclick="completeExercise(${idx})">[✓] GUARDAR EJERCICIO</button>
            </div>
          </div>
        `;

        if (ex.phase.includes("FUERZA")) {
          setTimeout(() => renderSets(idx), 30);
        } else {
          setTimeout(() => { document.getElementById(`btnFinish_${idx}`).style.display = "block"; }, 30);
        }
      });
      document.getElementById('routineCard').style.display = 'block';
    }

    function toggleBody(idx) {
      const b = document.getElementById(`body_${idx}`);
      b.style.display = b.style.display === 'block' ? 'none' : 'block';
    }

    function moveExercise(idx, dir) {
      const newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= state.currentRoutine.length) return;
      const tempEx = state.currentRoutine[idx];
      const tempSets = state.completedSets[idx];
      state.currentRoutine[idx] = state.currentRoutine[newIdx];
      state.completedSets[idx] = state.completedSets[newIdx];
      state.currentRoutine[newIdx] = tempEx;
      state.completedSets[newIdx] = tempSets;
      renderChecklist();
    }

    function substituteExercise(idx) {
      const current = state.currentRoutine[idx];
      const alternatives = EXERCISE_CATALOG.filter(e => e.pattern === current.pattern && e.name !== current.name);
      if (alternatives.length === 0) return alert("No hay otros ejercicios con el mismo vector biomecánico exacto.");

      let promptText = "Selecciona el número del sustituto:\n";
      alternatives.forEach((alt, i) => { promptText += `${i + 1}. ${alt.name} (${alt.equipment})\n`; });
      const choice = prompt(promptText);
      const chosenIdx = parseInt(choice) - 1;

      if (alternatives[chosenIdx]) {
        state.currentRoutine[idx] = {
          ...alternatives[chosenIdx],
          phase: current.phase,
          target: current.target,
          weight: alternatives[chosenIdx].isBodyweight ? 0 : 20,
          note: "Sustitución en vivo"
        };
        renderChecklist();
      }
    }

    function renderSets(idx) {
      const box = document.getElementById(`setsContainer_${idx}`);
      if (!box) return;
      box.innerHTML = '';

      state.completedSets[idx].forEach((s, sIdx) => {
        box.innerHTML += `
          <div class="set-row ${s.locked ? 'locked' : ''}" id="row_${idx}_${sIdx}">
            <div class="set-num">${sIdx + 1}</div>
            <input type="number" step="0.5" id="w_${idx}_${sIdx}" value="${s.weight}" ${s.locked ? 'disabled' : ''} oninput="autoPropagateWeight(${idx}, ${sIdx}, this.value)">
            <input type="number" id="r_${idx}_${sIdx}" value="${s.reps}" ${s.locked ? 'disabled' : ''}>
            <div class="rir-selector">
              <div class="rir-btn ${s.rir === 0 ? 'active' : ''}" onclick="setRIR(${idx}, ${sIdx}, 0)">R0</div>
              <div class="rir-btn ${s.rir === 1 ? 'active' : ''}" onclick="setRIR(${idx}, ${sIdx}, 1)">R1</div>
              <div class="rir-btn ${s.rir === 2 ? 'active' : ''}" onclick="setRIR(${idx}, ${sIdx}, 2)">R2</div>
              <div class="rir-btn ${s.rir === 3 ? 'active' : ''}" onclick="setRIR(${idx}, ${sIdx}, 3)">R3+</div>
            </div>
            <button class="btn-action-set" onclick="toggleSetLock(${idx}, ${sIdx})">${s.locked ? '✏️' : '✓'}</button>
          </div>
        `;
      });

      const allLocked = state.completedSets[idx].every(s => s.locked);
      document.getElementById(`btnFinish_${idx}`).style.display = allLocked ? "block" : "none";
    }

    function autoPropagateWeight(idx, sIdx, val) {
      state.completedSets[idx][sIdx].weight = parseFloat(val) || 0;
      if (sIdx === 0) {
        for (let i = 1; i < state.completedSets[idx].length; i++) {
          if (!state.completedSets[idx][i].locked) {
            state.completedSets[idx][i].weight = parseFloat(val) || 0;
            const input = document.getElementById(`w_${idx}_${i}`);
            if (input) input.value = val;
          }
        }
      }
    }

    function setRIR(idx, sIdx, val) {
      if (state.completedSets[idx][sIdx].locked) return;
      state.completedSets[idx][sIdx].rir = val;
      renderSets(idx);
    }

    function toggleSetLock(idx, sIdx) {
      if (!state.isSessionActive) return alert("Pulsa '▶️ INICIAR ENTRENAMIENTO' arriba primero.");
      
      const s = state.completedSets[idx][sIdx];
      if (s.locked) {
        s.locked = false;
        renderSets(idx);
      } else {
        const wVal = parseFloat(document.getElementById(`w_${idx}_${sIdx}`).value) || 0;
        const rVal = parseInt(document.getElementById(`r_${idx}_${sIdx}`).value) || 0;
        s.weight = wVal;
        s.reps = rVal;
        s.locked = true;
        renderSets(idx);

        // Disparar descanso si no es la última serie bloqueada
        const allLocked = state.completedSets[idx].every(item => item.locked);
        if (!allLocked) {
          startTimer(state.currentRoutine[idx].restSec || 90);
        }
      }
    }

    function completeExercise(idx) {
      const ex = state.currentRoutine[idx];
      const setsData = state.completedSets[idx].map((s, i) => ({
        setNum: i + 1,
        weight: s.weight,
        reps: s.reps,
        rir: s.rir
      }));

      // Guardar de forma atómica en el historial local
      const todayStr = new Date().toISOString().split('T')[0];
      let todayLog = state.history.find(h => h.date === todayStr);

      if (!todayLog) {
        todayLog = { date: todayStr, totalTonnage: 0, exercises: [] };
        state.history.unshift(todayLog);
      }

      // Reemplazar o insertar ejercicio
      const existingExIdx = todayLog.exercises.findIndex(e => e.name === ex.name);
      if (existingExIdx !== -1) {
        todayLog.exercises[existingExIdx] = { name: ex.name, group: ex.group, sets: setsData };
      } else {
        todayLog.exercises.push({ name: ex.name, group: ex.group, sets: setsData });
      }

      // Recalcular tonelaje
      todayLog.totalTonnage = todayLog.exercises.reduce((acc, curr) => {
        return acc + curr.sets.reduce((sAcc, s) => sAcc + (s.weight * s.reps), 0);
      }, 0);

      localStorage.setItem('gym_tracker_history', JSON.stringify(state.history));

      document.getElementById(`item_${idx}`).classList.add('completed');
      document.getElementById(`badge_${idx}`).innerText = "HECHO ✓";
      document.getElementById(`body_${idx}`).style.display = "none";
    }

    function promptAddExtraExercise() {
      const name = prompt("Nombre o búsqueda del ejercicio extra:");
      if (!name) return;
      const found = EXERCISE_CATALOG.find(e => e.name.toLowerCase().includes(name.toLowerCase())) || {
        id: "EXTRA", name: name, group: "General", pattern: "Libre", equipment: "Mancuerna", restSec: 90, isBodyweight: false, isIso: false, guide: "Libre"
      };

      state.currentRoutine.push({
        ...found,
        phase: "FASE 2: FUERZA E HIPERTROFIA",
        target: "8-12",
        weight: 20,
        note: "Bloque Extra"
      });
      renderChecklist();
    }

    // -------------------------------------------------------------
    // TEMPORIZADOR Y SEÑAL ACÚSTICA / HÁPTICA
    // -------------------------------------------------------------
    function startTimer(sec) {
      clearInterval(state.activeTimer);
      state.timeLeft = sec;
      updateTimerUI();
      document.getElementById('restModal').classList.add('active');

      state.activeTimer = setInterval(() => {
        state.timeLeft--;
        updateTimerUI();
        if (state.timeLeft <= 0) {
          closeTimer();
          if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.connect(ctx.destination);
            osc.frequency.value = 880;
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
          } catch(e){}
        }
      }, 1000);
    }

    function updateTimerUI() {
      const m = Math.floor(state.timeLeft / 60).toString().padStart(2, '0');
      const s = (state.timeLeft % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').innerText = `${m}:${s}`;
    }

    function addTimer(sec) { state.timeLeft += sec; updateTimerUI(); }
    function closeTimer() { clearInterval(state.activeTimer); document.getElementById('restModal').classList.remove('active'); }

    // -------------------------------------------------------------
    // RENDERIZADO DEL HISTORIAL Y BACKUPS
    // -------------------------------------------------------------
    function renderHistoryView() {
      const container = document.getElementById('historyList');
      if (state.history.length === 0) {
        container.innerHTML = '<div style="font-size:12px; color:var(--text-sec);">No hay sesiones registradas aún.</div>';
        return;
      }
      container.innerHTML = '';
      state.history.forEach(h => {
        let html = `
          <div class="hist-card">
            <div class="hist-header">
              <div class="hist-date">📅 ${h.date}</div>
              <div class="hist-tonnage">Tonelaje: ${h.totalTonnage.toLocaleString()} kg</div>
            </div>
        `;
        h.exercises.forEach(ex => {
          const setsStr = ex.sets.map(s => `${s.weight}kg × ${s.reps} (R${s.rir})`).join(' | ');
          html += `<div style="font-size:11px; margin-bottom:4px;"><strong>${ex.name}</strong>: ${setsStr}</div>`;
        });
        html += `</div>`;
        container.innerHTML += html;
      });
    }

    function exportDataBackup() {
      const blob = new Blob([JSON.stringify(state.history, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `gym_tracker_backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
    }

    function importDataBackup(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          if (Array.isArray(data)) {
            state.history = data;
            localStorage.setItem('gym_tracker_history', JSON.stringify(data));
            alert("Copia de seguridad restaurada correctamente.");
            renderHistoryView();
          }
        } catch(err) { alert("Archivo JSON no válido."); }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
