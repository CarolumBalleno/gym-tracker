<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>Gym Tracker Pro</title>
  
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --card-sub: #121215;
      --accent: #10b981; 
      --accent-hover: #059669;
      --red: #ef4444;
      --text: #f4f4f5;
      --text-sec: #a1a1aa;
      --border: #27272a;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(90px, env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg); color: var(--text); user-select: none;
    }

    .tab-bar { display: flex; gap: 6px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .tab-btn { flex: 1; padding: 10px 4px; background: var(--card); color: var(--text-sec); border: 1px solid var(--border); border-radius: 6px; font-size: 12px; font-weight: 800; text-transform: uppercase; cursor: pointer; text-align: center; }
    .tab-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

    .header { margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0; font-weight: 800; letter-spacing: -0.5px; text-transform: uppercase; }
    .subtitle { font-size: 11px; color: var(--accent); font-weight: 700; margin-top: 4px; }

    .card { background: var(--card); border-radius: 8px; padding: 14px; margin-bottom: 14px; border: 1px solid var(--border); }
    
    .primary-btn { width: 100%; background: var(--accent); color: var(--bg); border: none; padding: 14px; border-radius: 6px; font-size: 13px; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-bottom: 10px; }
    .primary-btn:active { opacity: 0.8; }
    
    .session-toggle-btn { width: 100%; background: var(--text); color: var(--bg); border: none; padding: 14px; border-radius: 6px; font-size: 13px; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-bottom: 14px; display: none; }
    .btn-extra { background: var(--bg); color: var(--text-sec); border: 1px dashed var(--border); font-size: 11px; padding: 12px; margin-top: 10px; width: 100%; cursor: pointer; font-weight: 700; text-transform: uppercase; }
    
    label { font-size: 10px; color: var(--text-sec); text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 6px; }
    select, input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 6px; font-size: 14px; outline: none; margin-bottom: 10px; -webkit-appearance: none; }

    .phase-tag { font-size: 10px; font-weight: 800; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; margin: 18px 0 8px 0; border-bottom: 1px solid var(--border); padding-bottom: 4px; }

    .checklist-item { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
    .checklist-item.completed { border-color: var(--accent); }
    .checklist-header { padding: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: var(--card-sub); }
    .checklist-title { font-weight: 800; font-size: 13px; text-transform: uppercase; flex: 1; margin-right: 8px; }
    .checklist-actions { display: flex; gap: 4px; align-items: center; }
    .icon-btn { background: var(--card); border: 1px solid var(--border); color: var(--text-sec); border-radius: 4px; padding: 6px 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .badge { font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 4px; background: var(--card); color: var(--text-sec); }
    .checklist-item.completed .badge { background: var(--accent); color: var(--bg); }
    .checklist-body { padding: 12px; border-top: 1px solid var(--border); display: none; }

    .tech-box { background: #000; border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-bottom: 10px; font-size: 11px; color: var(--text-sec); line-height: 1.4; }
    
    .table-headers { display: flex; gap: 4px; font-size: 9px; font-weight: 800; color: var(--text-sec); text-transform: uppercase; margin-bottom: 6px; }
    .col-num { width: 22px; text-align: center; }
    .col-w { flex: 1; text-align: center; }
    .col-r { flex: 1; text-align: center; }
    .col-rir { flex: 1.6; text-align: center; }
    .col-action { width: 34px; text-align: center; }

    .set-row { display: flex; gap: 4px; align-items: center; margin-bottom: 6px; background: var(--bg); padding: 4px; border-radius: 6px; border: 1px solid var(--border); }
    .set-row.locked { opacity: 0.5; border-color: var(--accent); }
    .set-num { font-weight: 700; width: 22px; color: var(--text-sec); text-align: center; font-size: 11px; }
    .set-row input { margin-bottom: 0; text-align: center; font-weight: 700; background: var(--card); border: none; padding: 8px 4px; border-radius: 4px; font-size: 13px; }
    
    .rir-selector { display: flex; gap: 2px; flex: 1.6; }
    .rir-btn { flex: 1; background: var(--card); color: var(--text-sec); padding: 8px 0; border-radius: 4px; font-size: 10px; font-weight: 800; text-align: center; cursor: pointer; }
    .rir-btn.active { background: var(--text); color: var(--bg); }

    .btn-action-set { width: 34px; height: 34px; background: var(--card); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn-sub { background: var(--bg); color: var(--text-sec); border: 1px dashed var(--border); font-size: 10px; padding: 8px; margin-bottom: 10px; width: 100%; cursor: pointer; font-weight: 700; text-transform: uppercase;}
    .btn-finish-ex { width: 100%; background: var(--accent); color: var(--bg); border: none; padding: 12px; border-radius: 6px; font-size: 12px; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-top: 8px; display: none; }

    /* MODAL DESCANSO / EXTRAS */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(9,9,11,0.96); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; padding: 20px; backdrop-filter: blur(5px); }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; width: 100%; max-width: 400px; }
    .rest-title { font-size: 12px; color: var(--text-sec); font-weight: 800; letter-spacing: 2px; margin-bottom: 16px; text-transform: uppercase; text-align: center; }
    .rest-timer { font-size: 64px; font-family: monospace; font-weight: 800; color: var(--accent); margin-bottom: 30px; text-align: center; }
    .rest-controls { display: flex; gap: 12px; justify-content: center; }
    .rest-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 12px 20px; border-radius: 6px; font-size: 13px; font-weight: 800; cursor: pointer; }
    .rest-btn.skip { background: var(--text); color: var(--bg); }

    /* HISTORIAL */
    .hist-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    .hist-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 10px; }
    .hist-date { font-size: 13px; font-weight: 800; color: var(--text); text-transform: uppercase; }
    .hist-metrics { display: flex; gap: 12px; font-size: 11px; font-weight: 700; }
    .hist-ex-row { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-bottom: 6px; }
    .hist-ex-title { font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; display: flex; justify-content: space-between; color: var(--accent); }
    .hist-sets-detail { font-size: 11px; color: var(--text-sec); font-family: monospace; }
  </style>
</head>
<body>

  <div class="modal-overlay" id="restModal">
    <div>
      <div class="rest-title">Recuperación Intramuscular</div>
      <div class="rest-timer" id="timerDisplay">00:00</div>
      <div class="rest-controls">
        <button class="rest-btn" onclick="addTimer(30)">+30s</button>
        <button class="rest-btn skip" onclick="closeTimer()">SALTAR</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="extraExModal">
    <div class="modal-content">
      <div class="rest-title" style="margin-bottom: 20px;">Añadir Bloque Extra</div>
      <label>Grupo Muscular</label>
      <select id="extraGroupSelect" onchange="populateExtraExercises()">
        <option value="">Selecciona Grupo...</option>
      </select>
      <label>Ejercicio</label>
      <select id="extraExSelect">
        <option value="">Primero selecciona grupo...</option>
      </select>
      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="primary-btn" style="margin: 0;" onclick="confirmExtraExercise()">Añadir</button>
        <button class="primary-btn" style="margin: 0; background: var(--bg); color: var(--text); border: 1px solid var(--border);" onclick="document.getElementById('extraExModal').classList.remove('active')">Cancelar</button>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-btn active" id="tabWork" onclick="switchTab('work')">🏋️ Entrenar</div>
    <div class="tab-btn" id="tabHist" onclick="switchTab('hist')">📅 Historial</div>
  </div>

  <div id="viewWork">
    <div class="header">
      <h1>Protocolo de Entrenamiento</h1>
      <div class="subtitle" id="workoutFocus">SISTEMA LOCAL-FIRST | CERO LATENCIA</div>
    </div>

    <button class="primary-btn" id="btnGen" onclick="generateWorkoutPlan()">Crear Plan Óptimo del Día</button>
    <button class="session-toggle-btn" id="btnSession" onclick="toggleSession()">▶️ INICIAR ENTRENAMIENTO</button>

    <div class="card" id="routineCard" style="display: none;">
      <div id="checklistContainer"></div>
      <button class="btn-extra" onclick="openExtraExModal()">+ Añadir Bloque Extra a la Sesión</button>
    </div>
  </div>

  <div id="viewHist" style="display: none;">
    <div class="header">
      <h1>Auditoría de Historial</h1>
      <div class="subtitle">Gestión de volumen acumulado</div>
    </div>
    <div id="historyList"></div>
  </div>

  <script>
    const EXERCISE_CATALOG = [
      // FASE 1: CALENTAMIENTO
      { id: "W01", name: "Movilidad Articular Dinámica", group: "Calentamiento", pattern: "Movilidad", equipment: "Peso Corporal", restSec: 0, isBodyweight: true, isIso: false, guide: "5 min rotaciones (escápulas, cadera, tobillos, muñecas)." },
      { id: "W02", name: "Cardio Suave de Activación", group: "Calentamiento", pattern: "Cardio", equipment: "Cinta / Elíptica", restSec: 0, isBodyweight: true, isIso: false, guide: "5-10 min a ritmo suave para elevar temperatura central." },
      { id: "W03", name: "Series de Aproximación", group: "Calentamiento", pattern: "Aproximación", equipment: "Libre", restSec: 60, isBodyweight: false, isIso: false, guide: "1-2 series al 40-50% del peso del primer ejercicio pesado." },
      { id: "W04", name: "Dislocaciones de Hombro", group: "Calentamiento", pattern: "Movilidad", equipment: "Pica / Goma", restSec: 0, isBodyweight: true, isIso: false, guide: "Movilidad escapular completa con banda elástica o pica." },

      // PECHO
      { id: "P01", name: "Press Banca Plano con Barra", group: "Pecho", pattern: "Empuje Horizontal", equipment: "Barra Olímpica", restSec: 120, isBodyweight: false, isIso: false, guide: "Retracción escapular, pies firmes, barra al esternón." },
      { id: "P02", name: "Press Plano con Mancuernas", group: "Pecho", pattern: "Empuje Horizontal", equipment: "Mancuernas", restSec: 90, isBodyweight: false, isIso: false, guide: "Descenso controlado hasta la línea media del pecho." },
      { id: "P03", name: "Press de Pecho en Máquina Convergente", group: "Pecho", pattern: "Empuje Horizontal", equipment: "Máquina", restSec: 90, isBodyweight: false, isIso: false, guide: "Empuje guiado; junta las manos al frente." },
      { id: "P04", name: "Press de Pecho Multipower (Smith)", group: "Pecho", pattern: "Empuje Horizontal", equipment: "Multipower", restSec: 90, isBodyweight: false, isIso: false, guide: "Máxima estabilidad. Baja la barra a la línea del pezón." },
      { id: "P05", name: "Press Inclinado con Mancuernas", group: "Pecho", pattern: "Empuje Inclinado", equipment: "Mancuernas", restSec: 90, isBodyweight: false, isIso: false, guide: "Banco a 30°-45°. Empuja sobre la vertical de los hombros." },
      { id: "P06", name: "Press Inclinado con Barra", group: "Pecho", pattern: "Empuje Inclinado", equipment: "Barra Olímpica", restSec: 120, isBodyweight: false, isIso: false, guide: "Descenso hacia la parte clavicular (alta) del pecho." },
      { id: "P07", name: "Press Inclinado en Máquina", group: "Pecho", pattern: "Empuje Inclinado", equipment: "Máquina", restSec: 90, isBodyweight: false, isIso: false, guide: "Aislamiento del pecho superior sin estabilización extra." },
      { id: "P08", name: "Press Inclinado Multipower", group: "Pecho", pattern: "Empuje Inclinado", equipment: "Multipower", restSec: 90, isBodyweight: false, isIso: false, guide: "Permite llegar al fallo con seguridad en el pecho alto." },
      { id: "P09", name: "Fondos en Paralelas (Enfoque Pecho)", group: "Pecho", pattern: "Empuje Declinado", equipment: "Peso Corporal", restSec: 120, isBodyweight: true, isIso: false, guide: "Torso inclinado hacia adelante 30°." },
      { id: "P10", name: "Press Declinado con Barra", group: "Pecho", pattern: "Empuje Declinado", equipment: "Barra Olímpica", restSec: 120, isBodyweight: false, isIso: false, guide: "Banco declinado. Enfoque en la porción esternocostal." },
      { id: "P11", name: "Press Declinado en Máquina", group: "Pecho", pattern: "Empuje Declinado", equipment: "Máquina", restSec: 90, isBodyweight: false, isIso: false, guide: "Empuja hacia abajo y al frente." },
      { id: "P12", name: "Aperturas en Pec Deck / Contractor", group: "Pecho", pattern: "Aducción Horizontal", equipment: "Máquina", restSec: 75, isBodyweight: false, isIso: false, guide: "Codos semiflexionados, aprieta 1 segundo al centro." },
      { id: "P13", name: "Cruce de Poleas desde Abajo", group: "Pecho", pattern: "Aducción Horizontal", equipment: "Polea Doble", restSec: 75, isBodyweight: false, isIso: false, guide: "Tracción hacia arriba y al centro para haz clavicular." },
      { id: "P14", name: "Cruce de Poleas desde Arriba", group: "Pecho", pattern: "Aducción Horizontal", equipment: "Polea Doble", restSec: 75, isBodyweight: false, isIso: false, guide: "Tracción hacia abajo cruzando al frente." },
      { id: "P15", name: "Aperturas con Mancuernas (Plano)", group: "Pecho", pattern: "Aducción Horizontal", equipment: "Mancuernas", restSec: 75, isBodyweight: false, isIso: false, guide: "Baja sintiendo el estiramiento; no dobles codos en exceso." },
      { id: "P16", name: "Aperturas Inclinadas Polea", group: "Pecho", pattern: "Aducción Horizontal", equipment: "Polea / Banco", restSec: 75, isBodyweight: false, isIso: false, guide: "Tensión máxima en la fase de estiramiento." },

      // ESPALDA
      { id: "E01", name: "Dominadas Pronas (Abiertas)", group: "Espalda", pattern: "Tracción Vertical", equipment: "Peso Corporal", restSec: 120, isBodyweight: true, isIso: false, guide: "Pecho a la barra, mayor reclutamiento fibras superiores." },
      { id: "E02", name: "Dominadas Neutras", group: "Espalda", pattern: "Tracción Vertical", equipment: "Peso Corporal", restSec: 120, isBodyweight: true, isIso: false, guide: "Agarre paralelo. Mayor rango de movimiento seguro." },
      { id: "E03", name: "Dominadas Supinas (Chin-ups)", group: "Espalda", pattern: "Tracción Vertical", equipment: "Peso Corporal", restSec: 120, isBodyweight: true, isIso: false, guide: "Palmas hacia ti. Gran participación del bíceps." },
      { id: "E04", name: "Jalón al Pecho Agarre Abierto", group: "Espalda", pattern: "Tracción Vertical", equipment: "Polea Alta", restSec: 90, isBodyweight: false, isIso: false, guide: "Codos apuntando al suelo, barra a la clavícula." },
      { id: "E05", name: "Jalón al Pecho Agarre Neutro/V", group: "Espalda", pattern: "Tracción Vertical", equipment: "Polea Alta", restSec: 90, isBodyweight: false, isIso: false, guide: "Permite un estiramiento profundo del dorsal." },
      { id: "E06", name: "Jalón Unilateral en Polea", group: "Espalda", pattern: "Tracción Vertical", equipment: "Polea Alta", restSec: 75, isBodyweight: false, isIso: false, guide: "Pega el codo a la cadera, enfocando un solo lado." },
      { id: "E07", name: "Jalón al Pecho Máquina Palanca", group: "Espalda", pattern: "Tracción Vertical", equipment: "Máquina", restSec: 90, isBodyweight: false, isIso: false, guide: "Movimiento guiado y convergente." },
      { id: "E08", name: "Remo con Barra 45° (Prono)", group: "Espalda", pattern: "Tracción Horizontal", equipment: "Barra Olímpica", restSec: 120, isBodyweight: false, isIso: false, guide: "Trabaja la densidad de la espalda alta." },
      { id: "E09", name: "Remo con Barra 45° (Supino)", group: "Espalda", pattern: "Tracción Horizontal", equipment: "Barra Olímpica", restSec: 120, isBodyweight: false, isIso: false, guide: "Codos pegados al cuerpo, mayor foco en el dorsal." },
      { id: "E10", name: "Remo Unilateral con Mancuerna", group: "Espalda", pattern: "Tracción Horizontal", equipment: "Mancuernas", restSec: 90, isBodyweight: false, isIso: false, guide: "Apoyo en banco, tracción hacia la cadera." },
      { id: "E11", name: "Remo Gironda (Polea Baja)", group: "Espalda", pattern: "Tracción Horizontal", equipment: "Polea Baja", restSec: 90, isBodyweight: false, isIso: false, guide: "Saca pecho al contraer y deja avanzar escápulas al estirar." },
      { id: "E12", name: "Remo en Máquina (Pecho Apoyado)", group: "Espalda", pattern: "Tracción Horizontal", equipment: "Máquina", restSec: 90, isBodyweight: false, isIso: false, guide: "Aísla la espalda sin fatiga lumbar." },
      { id: "E13", name: "Remo en Barra T (Pecho Apoyado)", group: "Espalda", pattern: "Tracción Horizontal", equipment: "Máquina Barra T", restSec: 90, isBodyweight: false, isIso: false, guide: "Máxima carga con la zona lumbar protegida." },
      { id: "E14", name: "Remo con Mancuernas Pecho Apoyado", group: "Espalda", pattern: "Tracción Horizontal", equipment: "Mancuernas / Banco", restSec: 90, isBodyweight: false, isIso: false, guide: "Banco a 30°, tracciona ambas mancuernas a la vez." },
      { id: "E15", name: "Pull-over en Polea Alta con Cuerda", group: "Espalda", pattern: "Extensión Hombro", equipment: "Polea Alta", restSec: 75, isBodyweight: false, isIso: false, guide: "Brazos casi rectos, tracciona hacia los muslos." },
      { id: "E16", name: "Pull-over en Polea Alta con Barra", group: "Espalda", pattern: "Extensión Hombro", equipment: "Polea Alta", restSec: 75, isBodyweight: false, isIso: false, guide: "Agarre prono; enfocado en dorsal ancho." },
      { id: "E17", name: "Pull-over con Mancuerna en Banco", group: "Espalda", pattern: "Extensión Hombro", equipment: "Mancuerna", restSec: 90, isBodyweight: false, isIso: false, guide: "Tumbado perpendicular al banco. Estiramiento extremo." },

      // CUÁDRICEPS
      { id: "Q01", name: "Sentadilla Trasera con Barra", group: "Cuádriceps", pattern: "Dominante Rodilla", equipment: "Barra / Rack", restSec: 180, isBodyweight: false, isIso: false, guide: "Rompe el paralelo manteniendo columna neutra." },
      { id: "Q02", name: "Sentadilla Frontal con Barra", group: "Cuádriceps", pattern: "Dominante Rodilla", equipment: "Barra / Rack", restSec: 120, isBodyweight: false, isIso: false, guide: "Torso más vertical, mayor estímulo en cuádriceps." },
      { id: "Q03", name: "Prensa de Piernas 45°", group: "Cuádriceps", pattern: "Dominante Rodilla", equipment: "Prensa", restSec: 120, isBodyweight: false, isIso: false, guide: "Baja profundo sin despegar la pelvis del respaldo." },
      { id: "Q04", name: "Sentadilla Hack en Máquina", group: "Cuádriceps", pattern: "Dominante Rodilla", equipment: "Máquina Hack", restSec: 120, isBodyweight: false, isIso: false, guide: "Apoyo dorsal total para aislar cuádriceps pesado." },
      { id: "Q05", name: "Sentadilla Búlgara con Mancuernas", group: "Cuádriceps", pattern: "Dominante Rodilla", equipment: "Mancuernas", restSec: 90, isBodyweight: false, isIso: false, guide: "Pie trasero apoyado. Baja vertical." },
      { id: "Q06", name: "Sentadilla Búlgara en Multipower", group: "Cuádriceps", pattern: "Dominante Rodilla", equipment: "Multipower", restSec: 90, isBodyweight: false, isIso: false, guide: "Elimina inestabilidad para exprimir el músculo." },
      { id: "Q07", name: "Sentadilla Goblet con Mancuerna", group: "Cuádriceps", pattern: "Dominante Rodilla", equipment: "Mancuerna", restSec: 90, isBodyweight: false, isIso: false, guide: "Mancuerna pegada al pecho, excelente para técnica." },
      { id: "Q08", name: "Zancadas / Lunges Caminando", group: "Cuádriceps", pattern: "Dominante Rodilla", equipment: "Mancuernas", restSec: 90, isBodyweight: false, isIso: false, guide: "Pasos amplios y controlados." },
      { id: "Q09", name: "Prensa Horizontal de Piernas", group: "Cuádriceps", pattern: "Dominante Rodilla", equipment: "Prensa", restSec: 90, isBodyweight: false, isIso: false, guide: "Menor carga espinal que la prensa 45°." },
      { id: "Q10", name: "Extensiones de Cuádriceps", group: "Cuádriceps", pattern: "Extensión Rodilla", equipment: "Máquina Extensión", restSec: 75, isBodyweight: false, isIso: false, guide: "Extiende completo y aguanta 1 segundo arriba." },
      { id: "Q11", name: "Extensiones de Cuádriceps Unilateral", group: "Cuádriceps", pattern: "Extensión Rodilla", equipment: "Máquina Extensión", restSec: 75, isBodyweight: false, isIso: false, guide: "Trabaja cada pierna por separado." },
      { id: "Q12", name: "Sissy Squat", group: "Cuádriceps", pattern: "Extensión Rodilla", equipment: "Peso Corporal", restSec: 90, isBodyweight: true, isIso: false, guide: "Aislamiento extremo del cuádriceps usando tu peso." },

    let state = {
      isSessionActive: false,

      completedSets: {},

      activeTimer: null,
      timeLeft: 0

    window.onload = () => { renderHistoryView(); };

    function switchTab(t) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('viewWork').style.display = 'none';
      document.getElementById('viewHist').style.display = 'none';

      if (t === 'work') {
        document.getElementById('tabWork').classList.add('active');
        document.getElementById('viewWork').style.display = 'block';
      } else if (t === 'hist') {
        document.getElementById('tabHist').classList.add('active');
        document.getElementById('viewHist').style.display = 'block';
        renderHistoryView();
      }
    }

    function generateWorkoutPlan() {
      const todayStr = new Date().toISOString().split('T')[0];
      const trainedToday = state.history.some(h => h.date === todayStr);

      if (trainedToday) {
        alert("🛡️ Ya completaste una sesión hoy. Descansa o usa 'Añadir Bloque Extra' si olvidaste anotar algo.");
        return;
      }

      const lastGroupDates = {};
      state.history.forEach(h => {
        h.exercises.forEach(ex => {
          if (!lastGroupDates[ex.group] || lastGroupDates[ex.group] < h.date) lastGroupDates[ex.group] = h.date;
        });
      });

      const today = new Date();
      const groupsRest = [];
      const strengthGroups = ["Pecho", "Espalda", "Cuádriceps", "Isquios", "Hombro", "Bíceps", "Tríceps", "Glúteo"];

      strengthGroups.forEach(g => {
        let days = 30 + Math.floor(Math.random() * 5);
        if (lastGroupDates[g]) {
          const diff = today - new Date(lastGroupDates[g]);
          days = Math.max(0, Math.floor(diff / (1000 * 60 * 60 * 24)));
        }
        groupsRest.push({ group: g, days: days });
      });

      groupsRest.sort((a,b) => b.days - a.days);
      const targetGroups = [groupsRest[0].group, groupsRest[1].group];

      document.getElementById('workoutFocus').innerText = `ENFOQUE DE HOY: ${targetGroups.join(' + ').toUpperCase()}`;

      const planned = [];
      planned.push({ ...EXERCISE_CATALOG[0], phase: "FASE 1: CALENTAMIENTO", target: "10 min", weight: 0 });

      let count = 0;
      for (let ex of EXERCISE_CATALOG) {
        if (targetGroups.includes(ex.group) && count < 4 && ex.group !== "Core" && ex.group !== "Cardio" && ex.group !== "Calentamiento") {
          let w = ex.isBodyweight ? 0 : 20;
          let note = ex.isBodyweight ? "Lastre / Ayuda" : "Carga inicial";
          
          const lastLog = findLastExerciseLog(ex.name);
          if (lastLog && lastLog.sets.length > 0) {
            const lastSet = lastLog.sets[lastLog.sets.length - 1];
            if (lastSet.reps < 8 && !ex.isIso) {
              w = ex.isBodyweight ? lastSet.weight : Math.round((lastSet.weight * 0.9) * 2) / 2;
              note = "Descarga táctica (-10%)";
            } else if (lastSet.rir >= 2 && !ex.isIso) {
              w = ex.isBodyweight ? lastSet.weight : Math.round((lastSet.weight * 1.025) * 2) / 2;
              note = "Sobrecarga (+2.5%)";
            } else {
              w = lastSet.weight; note = "Mantenimiento";
            }
          }
          planned.push({ ...ex, phase: "FASE 2: FUERZA", target: "8-12 reps", weight: w, note: note });
          count++;
        }
      }

      const coreEx = EXERCISE_CATALOG.filter(e => e.group === "Core");
      const rc = coreEx[Math.floor(Math.random() * coreEx.length)];
      if (rc) planned.push({ ...rc, phase: "FASE 3: CORE", target: rc.isIso ? "45s-60s" : "10-15 reps", weight: 0 });

      const cardio = EXERCISE_CATALOG.find(e => e.group === "Cardio");
      if (cardio) planned.push({ ...cardio, phase: "FASE 4: CARDIO", target: "15 min", weight: 0 });

      state.currentRoutine = planned;
      document.getElementById('btnGen').style.display = 'none';
      document.getElementById('btnSession').style.display = 'block';
      renderChecklist();
    }

    function findLastExerciseLog(name) {
      for (let h of state.history) {
        const f = h.exercises.find(e => e.name === name);
        if (f) return f;
      }
      return null;
    }

    function toggleSession() {
      state.isSessionActive = !state.isSessionActive;
      const btn = document.getElementById('btnSession');
      if (state.isSessionActive) {
        btn.innerText = "⏹️ FINALIZAR SESIÓN Y GUARDAR";
        btn.style.background = "var(--red)";
      } else {
        btn.innerText = "▶️ INICIAR ENTRENAMIENTO";
        btn.style.background = "var(--text)";
        btn.style.color = "var(--bg)";
      }
    }

    function renderChecklist() {
      const container = document.getElementById('checklistContainer');
      container.innerHTML = '';
      let lastPhase = "";
      
      state.currentRoutine.forEach((ex, idx) => {
        if (!state.completedSets[idx]) {
          state.completedSets[idx] = [
            { weight: ex.weight, reps: ex.isIso ? 45 : 10, rir: 2, locked: false },
            { weight: ex.weight, reps: ex.isIso ? 45 : 10, rir: 2, locked: false },
            { weight: ex.weight, reps: ex.isIso ? 45 : 10, rir: 2, locked: false }
          ];
        }

        if (ex.phase !== lastPhase) {
          container.innerHTML += `<div class="phase-tag">${ex.phase}</div>`;
          lastPhase = ex.phase;
        }

        const badge = ex.isBodyweight ? "BW" : (ex.isIso ? "ISO" : `${ex.weight}kg`);

        container.innerHTML += `
          <div class="checklist-item" id="item_${idx}">
            <div class="checklist-header">
              <div class="checklist-title" onclick="toggleBody(${idx})">
                <span style="color:var(--accent); font-size:10px; display:block;">${ex.group}</span>
                ${ex.name}
              </div>
              <div class="checklist-actions">
                <button class="icon-btn" onclick="moveExercise(${idx}, -1)">▲</button>
                <button class="icon-btn" onclick="moveExercise(${idx}, 1)">▼</button>
                <div class="badge" id="badge_${idx}">${badge}</div>
              </div>
            </div>
            <div class="checklist-body" id="body_${idx}">
              <div class="tech-box">
                <strong>Equip:</strong> ${ex.equipment}<br>
                <strong>Técnica:</strong> ${ex.guide}<br>
                <strong style="color:var(--accent);">Info:</strong> ${ex.note || ''}
              </div>

              ${ex.phase.includes("FUERZA") || ex.phase.includes("CORE") ? `
                <button class="btn-sub" onclick="substituteExercise(${idx})">🔄 Máquina Ocupada (Sustituir)</button>
                <div class="table-headers">
                  <div class="col-num">#</div>
                  <div class="col-w">${ex.isBodyweight ? '+LASTRE' : 'PESO'}</div>
                  <div class="col-r">${ex.isIso ? 'SEG' : 'REPS'}</div>
                  <div class="col-rir">RIR</div>
                  <div class="col-action">OK</div>
                </div>
                <div id="setsContainer_${idx}"></div>
              ` : `
                <div style="font-size: 12px; margin-bottom: 8px;">Objetivo: <strong>${ex.target}</strong></div>
              `}
              <button class="btn-finish-ex" id="btnFinish_${idx}" onclick="completeExercise(${idx})">[✓] REGISTRAR</button>
            </div>
          </div>
        `;

        if (ex.phase.includes("FUERZA") || ex.phase.includes("CORE")) {
          setTimeout(() => renderSets(idx), 10);
        } else {
          setTimeout(() => { document.getElementById(`btnFinish_${idx}`).style.display = "block"; }, 10);
        }
      });
      document.getElementById('routineCard').style.display = 'block';
    }

    function toggleBody(idx) {
      const b = document.getElementById(`body_${idx}`);
      b.style.display = b.style.display === 'block' ? 'none' : 'block';
    }

    function moveExercise(idx, dir) {
      const newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= state.currentRoutine.length) return;
      const tempEx = state.currentRoutine[idx];
      const tempSets = state.completedSets[idx];
      state.currentRoutine[idx] = state.currentRoutine[newIdx];
      state.completedSets[idx] = state.completedSets[newIdx];
      state.currentRoutine[newIdx] = tempEx;
      state.completedSets[newIdx] = tempSets;
      renderChecklist();
    }

    function substituteExercise(idx) {
      const current = state.currentRoutine[idx];
      const alts = EXERCISE_CATALOG.filter(e => e.pattern === current.pattern && e.name !== current.name);
      if (alts.length === 0) return alert("Sin alternativas del mismo patrón biomecánico exacto.");

      let text = "Sustituto Mismo Patrón:\n";
      alts.forEach((a, i) => { text += `${i + 1}. ${a.name}\n`; });
      const choice = prompt(text);
      if (!choice) return;
      
      const chosenIdx = parseInt(choice) - 1;
      if (alts[chosenIdx]) {
        state.currentRoutine[idx] = { ...alts[chosenIdx], phase: current.phase, target: current.target, weight: alts[chosenIdx].isBodyweight ? 0 : 20, note: "Sustitución en vivo" };
        renderChecklist();
      }
    }

    function renderSets(idx) {
      const box = document.getElementById(`setsContainer_${idx}`);
      if (!box) return;
      box.innerHTML = '';

      state.completedSets[idx].forEach((s, sIdx) => {
        box.innerHTML += `
          <div class="set-row ${s.locked ? 'locked' : ''}" id="row_${idx}_${sIdx}">
            <div class="set-num">${sIdx + 1}</div>
            <input type="number" step="0.5" id="w_${idx}_${sIdx}" value="${s.weight}" ${s.locked ? 'disabled' : ''} oninput="autoPropagateWeight(${idx}, ${sIdx}, this.value)">
            <input type="number" id="r_${idx}_${sIdx}" value="${s.reps}" ${s.locked ? 'disabled' : ''}>
            <div class="rir-selector">
              <div class="rir-btn ${s.rir === 0 ? 'active' : ''}" onclick="setRIR(${idx}, ${sIdx}, 0)">R0</div>
              <div class="rir-btn ${s.rir === 1 ? 'active' : ''}" onclick="setRIR(${idx}, ${sIdx}, 1)">R1</div>
              <div class="rir-btn ${s.rir === 2 ? 'active' : ''}" onclick="setRIR(${idx}, ${sIdx}, 2)">R2</div>
              <div class="rir-btn ${s.rir === 3 ? 'active' : ''}" onclick="setRIR(${idx}, ${sIdx}, 3)">R3+</div>
            </div>
            <button class="btn-action-set" onclick="toggleSetLock(${idx}, ${sIdx})">${s.locked ? '✏️' : '✓'}</button>
          </div>
        `;
      });
      const allLocked = state.completedSets[idx].every(s => s.locked);
      document.getElementById(`btnFinish_${idx}`).style.display = allLocked ? "block" : "none";
    }

    function autoPropagateWeight(idx, sIdx, val) {
      state.completedSets[idx][sIdx].weight = parseFloat(val) || 0;
      if (sIdx === 0) {
        for (let i = 1; i < state.completedSets[idx].length; i++) {
          if (!state.completedSets[idx][i].locked) {
            state.completedSets[idx][i].weight = parseFloat(val) || 0;
            const el = document.getElementById(`w_${idx}_${i}`);
            if (el) el.value = val;
          }
        }
      }
    }

    function setRIR(idx, sIdx, val) {
      if (state.completedSets[idx][sIdx].locked) return;
      state.completedSets[idx][sIdx].rir = val;
      renderSets(idx);
    }

    function toggleSetLock(idx, sIdx) {
      if (!state.isSessionActive) return alert("Pulsa '▶️ INICIAR ENTRENAMIENTO' arriba primero.");
      const s = state.completedSets[idx][sIdx];
      if (s.locked) {
        s.locked = false; renderSets(idx);
      } else {
        s.weight = parseFloat(document.getElementById(`w_${idx}_${sIdx}`).value) || 0;
        s.reps = parseInt(document.getElementById(`r_${idx}_${sIdx}`).value) || 0;
        s.locked = true; renderSets(idx);

        if (!state.completedSets[idx].every(item => item.locked)) {
          startTimer(state.currentRoutine[idx].restSec || 90);
        }
      }
    }

    function completeExercise(idx) {
      const ex = state.currentRoutine[idx];
      const setsData = state.completedSets[idx] ? state.completedSets[idx].map((s, i) => ({ setNum: i + 1, weight: s.weight, reps: s.reps, rir: s.rir })) : [{setNum:1, weight:0, reps:1, rir:2}];

      const todayStr = new Date().toISOString().split('T')[0];
      let todayLog = state.history.find(h => h.date === todayStr);

      if (!todayLog) {
        todayLog = { date: todayStr, totalTonnage: 0, totalSets: 0, exercises: [] };
        state.history.unshift(todayLog);
      }

      const existingIdx = todayLog.exercises.findIndex(e => e.name === ex.name);
      if (existingIdx !== -1) todayLog.exercises[existingIdx] = { name: ex.name, group: ex.group, sets: setsData };
      else todayLog.exercises.push({ name: ex.name, group: ex.group, sets: setsData });

      todayLog.totalTonnage = 0; todayLog.totalSets = 0;
      todayLog.exercises.forEach(e => {
        e.sets.forEach(s => { todayLog.totalTonnage += (s.weight * s.reps); todayLog.totalSets++; });
      });

      localStorage.setItem('gym_tracker_history', JSON.stringify(state.history));
      document.getElementById(`item_${idx}`).classList.add('completed');
      document.getElementById(`badge_${idx}`).innerText = "HECHO ✓";
      document.getElementById(`body_${idx}`).style.display = "none";
    }

    function openExtraExModal() {
      const groups = [...new Set(EXERCISE_CATALOG.map(e => e.group))].sort();
      const sel = document.getElementById('extraGroupSelect');
      sel.innerHTML = '<option value="">Selecciona Grupo...</option>';
      groups.forEach(g => sel.innerHTML += `<option value="${g}">${g}</option>`);
      document.getElementById('extraExModal').classList.add('active');
    }

    function populateExtraExercises() {
      const g = document.getElementById('extraGroupSelect').value;
      const sel = document.getElementById('extraExSelect');
      sel.innerHTML = '<option value="">Selecciona Ejercicio...</option>';
      EXERCISE_CATALOG.filter(e => e.group === g).forEach(e => sel.innerHTML += `<option value="${e.name}">${e.name}</option>`);
    }

    function confirmExtraExercise() {
      const name = document.getElementById('extraExSelect').value;
      if (!name) return alert("Selecciona un ejercicio.");
      const ex = EXERCISE_CATALOG.find(e => e.name === name);
      
      state.currentRoutine.push({
        ...ex,
        phase: "BLOQUE EXTRA AÑADIDO",
        target: ex.isIso ? "45s" : "8-12 reps",
        weight: ex.isBodyweight ? 0 : 20,
        note: "Ejercicio fuera de planificación"
      });
      document.getElementById('extraExModal').classList.remove('active');
      renderChecklist();
    }

    function startTimer(sec) {
      clearInterval(state.activeTimer); state.timeLeft = sec; updateTimerUI();
      document.getElementById('restModal').classList.add('active');
      state.activeTimer = setInterval(() => {
        state.timeLeft--; updateTimerUI();
        if (state.timeLeft <= 0) {
          closeTimer();
          if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
        }
      }, 1000);
    }
    function updateTimerUI() {
      const m = Math.floor(state.timeLeft / 60).toString().padStart(2, '0');
      const s = (state.timeLeft % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').innerText = `${m}:${s}`;
    }
    function addTimer(sec) { state.timeLeft += sec; updateTimerUI(); }
    function closeTimer() { clearInterval(state.activeTimer); document.getElementById('restModal').classList.remove('active'); }

    function renderHistoryView() {
      const container = document.getElementById('historyList');
      if (state.history.length === 0) {
        container.innerHTML = '<div style="font-size:12px; color:var(--text-sec);">Historial vacío.</div>'; return;
      }
      container.innerHTML = '';
      state.history.forEach((h, hIdx) => {
        let html = `
          <div class="hist-card">
            <div class="hist-header">
              <div class="hist-date">📅 ${h.date}</div>
              <div class="hist-metrics">
                <span style="color:var(--accent);">🏋️ ${h.totalTonnage.toLocaleString()} kg</span>
                <span style="color:var(--text-sec);">📊 ${h.totalSets || 0} Series</span>
              </div>
            </div>
        `;
        h.exercises.forEach(ex => {
          const setsStr = ex.sets.map(s => `${s.weight}kg × ${s.reps}`).join(' | ');
          html += `
            <div class="hist-ex-row">
              <div class="hist-ex-title"><span>${ex.name}</span><span>${ex.group}</span></div>
              <div class="hist-sets-detail">${setsStr}</div>
            </div>
          `;
        });
        
        html += `
            <div style="display:flex; gap:8px; margin-top:10px;">
              <button class="primary-btn" style="background:var(--card-sub); border:1px solid var(--border); color:var(--text); font-size:11px; padding:8px; margin:0;" onclick="editPastSession(${hIdx})">✏️ Editar Sesión</button>
            </div>
          </div>
        `;
        container.innerHTML += html;
      });
    }

    function editPastSession(idx) {
      if (confirm("Se va a cargar esta sesión para que puedas modificarla. ¿Continuar?")) {
        const past = state.history[idx];
        state.history.splice(idx, 1);
        localStorage.setItem('gym_tracker_history', JSON.stringify(state.history));
        
        state.currentRoutine = past.exercises.map(e => {
          const exCat = EXERCISE_CATALOG.find(c => c.name === e.name) || { isBodyweight: false, isIso: false, equipment: "Var.", guide: "N/A", restSec: 90 };
          return { ...exCat, name: e.name, group: e.group, phase: "MODO EDICIÓN", target: "Libre", note: "Editando datos del pasado." };
        });

        state.completedSets = {};
        past.exercises.forEach((e, i) => { state.completedSets[i] = e.sets.map(s => ({ weight: s.weight, reps: s.reps, rir: s.rir, locked: true })); });

        document.getElementById('workoutFocus').innerText = `MODO EDICIÓN: ${past.date}`;
        switchTab('work');
        document.getElementById('btnGen').style.display = 'none'; document.getElementById('btnSession').style.display = 'block';
        toggleSession(); renderChecklist();
      }
    }
  </script>
</body>
</html>
